 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

repositories {
    mavenCentral()
}

group = 'dev.ngb.base_hub'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

ext {
    set('sentryVersion', "8.27.0")
    set('springAiVersion', "1.1.0")
    set('springModulithVersion', "1.4.4")
}

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spring.io/snapshot' }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
            mavenBom "io.sentry:sentry-bom:${sentryVersion}"
            mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        }
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-amqp'
        implementation 'org.springframework.boot:spring-boot-starter-batch'
        implementation 'org.springframework.boot:spring-boot-starter-cache'
//    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
        implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-graphql'
        implementation 'org.springframework.boot:spring-boot-starter-integration'
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.springframework.boot:spring-boot-starter-mail'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
        implementation 'org.springframework.boot:spring-boot-starter-quartz'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'io.sentry:sentry-spring-boot-starter-jakarta'
//    implementation 'org.apache.kafka:kafka-streams'
        implementation 'org.liquibase:liquibase-core'
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
//        implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
//        implementation 'org.springframework.ai:spring-ai-pdf-document-reader'
//    implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-embedding'
//    implementation 'org.springframework.ai:spring-ai-starter-model-vertex-ai-gemini'
//        implementation 'org.springframework.amqp:spring-rabbit-stream'
//    implementation 'org.springframework.integration:spring-integration-amqp'
        implementation 'org.springframework.integration:spring-integration-http'
        implementation 'org.springframework.integration:spring-integration-jdbc'
//    implementation 'org.springframework.integration:spring-integration-kafka'
        implementation 'org.springframework.integration:spring-integration-mail'
        implementation 'org.springframework.integration:spring-integration-redis'
//    implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.modulith:spring-modulith-events-api'
        implementation 'org.springframework.modulith:spring-modulith-starter-core'
        implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
        implementation 'org.springframework.security:spring-security-messaging'
        implementation 'org.redisson:redisson:3.52.0'
        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        runtimeOnly 'org.postgresql:postgresql'
        runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
        runtimeOnly 'org.springframework.modulith:spring-modulith-events-amqp'
        runtimeOnly 'org.springframework.modulith:spring-modulith-observability'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
//    testImplementation 'org.springframework.amqp:spring-rabbit-test'
        testImplementation 'org.springframework.batch:spring-batch-test'
        testImplementation 'org.springframework.graphql:spring-graphql-test'
        testImplementation 'org.springframework.integration:spring-integration-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:2.8.13'

        implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
    }

    test {
        useJUnitPlatform()
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}