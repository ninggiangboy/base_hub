services:
  nginx:
    image: nginx:1.29.3
    container_name: base_hub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: base_hub_elasticsearch
    environment:
      - ELASTIC_PASSWORD=secret
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - '9200:9200'
      - '9300:9300'
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0
    container_name: base_hub_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - '5601:5601'
    depends_on:
      - elasticsearch
  postgres:
    image: postgres:18.0
    container_name: base_hub_postgres
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - '5432:5432'
  rabbitmq:
    image: rabbitmq:4.2.0
    container_name: base_hub_rabbitmq
    environment:
      - RABBITMQ_DEFAULT_PASS=secret
      - RABBITMQ_DEFAULT_USER=myuser
    ports:
      - '5672:5672'
  valkey:
    image: valkey/valkey:9.0.0
    container_name: base_hub_valkey
    ports:
      - '6379:6379'
  # redis:
  #   image: redis:8.2.2
  #   container_name: base_hub_redis
  #   ports:
  #     - '6379:6379'
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: base_hub_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secret123
    ports:
      - "9000:9000"
      - "9001:9001"
  maildev:
    image: maildev/maildev:2.2.1
    container_name: base_hub_maildev
    ports:
      - "1080:1080"
      - "1025:1025"
